# Every intended difference between the gateway and an oracle, read by
# oracle_wire_diff_tests.rs. An observed difference not listed here fails the
# run, and so does an entry here that no longer occurs: when a gap closes, its
# entry goes. `oracles` limits an entry to some oracles; without it, it applies
# to every oracle. `issue` is the apache/iggy issue that owns the gap.

# Documented: past the high watermark the gateway answers retriable 6 for 30 s before 1.
[[difference]]
scenario = "produce_fetch"
fact = "fetch_beyond_end.error"
issue = "apache/iggy#3536"
reason = "README Fetch error mapping: OFFSET_OUT_OF_RANGE only after 30 s of NOT_LEADER_OR_FOLLOWER, so a lagging node is not mistaken for data loss"

# Topic configs: an Iggy topic never expires by default.
[[difference]]
scenario = "describe_configs"
fact = "retention.ms.value"
issue = "apache/iggy#4508"
reason = "an Iggy topic never expires by default; Kafka's default is 7 days"

# KW-4: a topic without a retention.ms override reports Iggy's default.
[[difference]]
scenario = "topic_configs"
fact = "all.retention.ms.value"
issue = "apache/iggy#4508"
reason = "an Iggy topic never expires by default, so the default retention.ms is -1; Kafka's default is 7 days"

[[difference]]
scenario = "topic_configs"
fact = "after_delete.retention.ms.value"
issue = "apache/iggy#4508"
reason = "a deleted retention.ms override goes back to Iggy's default, -1 (never expire); Kafka's default is 7 days"

# KW-4: no broker-level dynamic configs on the gateway.
[[difference]]
scenario = "topic_configs"
fact = "after_delete.min.insync.replicas.source"
issue = "apache/iggy#4508"
reason = "the gateway has no cluster-wide dynamic broker defaults, so a topic without an override reports min.insync.replicas as DEFAULT_CONFIG (5); a KRaft Kafka cluster keeps min.insync.replicas as a dynamic cluster default and reports DYNAMIC_DEFAULT_BROKER_CONFIG (3)"

# After a restart the gateway still deduplicates a retry of an older batch.
[[difference]]
scenario = "idempotent_restart"
fact = "retry_first.error"
oracles = ["kafka"]
issue = "apache/iggy#4513"
reason = "Kafka keeps the last 5 batches per producer in memory, but its snapshot restores only the last one, so after a restart a retry of an older batch gets OUT_OF_ORDER_SEQUENCE_NUMBER (45). The gateway rebuilds all 5 from the kafka.p log markers and deduplicates the retry, answering its original offset. That is the answer Kafka gives without a restart, and nothing is written twice."

# After a restart the gateway still deduplicates a retry of an older batch.
[[difference]]
scenario = "idempotent_restart"
fact = "retry_first.base_offset"
oracles = ["kafka"]
issue = "apache/iggy#4513"
reason = "Kafka keeps the last 5 batches per producer in memory, but its snapshot restores only the last one, so after a restart a retry of an older batch gets OUT_OF_ORDER_SEQUENCE_NUMBER (45). The gateway rebuilds all 5 from the kafka.p log markers and deduplicates the retry, answering its original offset. That is the answer Kafka gives without a restart, and nothing is written twice."
