# Vector as a Kafka producer: stdin (the matrix's records, one JSON object per line) through a
# remap into the kafka sink, keyed, with the probe headers. Vector exits when stdin ends, after
# its sinks flush. BOOTSTRAP and TOPIC come from the environment.
sources:
  records:
    type: stdin
transforms:
  shape:
    type: remap
    inputs: [records]
    source: |
      r = parse_json!(.message)
      . = {"key": r.key, "message": r.value, "headers": {"idx": r.idx, "src": "matrix"}}
sinks:
  kafka:
    type: kafka
    inputs: [shape]
    bootstrap_servers: "${BOOTSTRAP}"
    topic: "${TOPIC}"
    key_field: key
    headers_key: headers
    encoding:
      codec: text
