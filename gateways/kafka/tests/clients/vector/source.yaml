# Vector as a Kafka consumer: the kafka source in a group, printing each event as JSON on stdout.
# Offsets are committed every second and on shutdown. BOOTSTRAP, TOPIC and GROUP come from the
# environment.
sources:
  kafka:
    type: kafka
    bootstrap_servers: "${BOOTSTRAP}"
    group_id: "${GROUP}"
    topics: ["${TOPIC}"]
    auto_offset_reset: earliest
    commit_interval_ms: 1000
sinks:
  out:
    type: console
    inputs: [kafka]
    encoding:
      codec: json
