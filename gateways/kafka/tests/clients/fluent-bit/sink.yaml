# Fluent Bit as a Kafka producer: tail the matrix's records (one JSON object per line) from the
# head, and send each to out_kafka keyed by its "key" field. The value is the record as JSON;
# out_kafka sets no headers. BOOTSTRAP and TOPIC come from the environment.
service:
  flush: 1
  grace: 10
  log_level: warn
parsers:
  - name: record
    format: json
pipeline:
  inputs:
    - name: tail
      path: /records.jsonl
      read_from_head: true
      exit_on_eof: true
      parser: record
  outputs:
    - name: kafka
      match: "*"
      brokers: ${BOOTSTRAP}
      topics: ${TOPIC}
      message_key_field: key
      format: json
      timestamp_key: "@ts"
