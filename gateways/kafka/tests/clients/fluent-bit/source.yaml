# Fluent Bit as a Kafka consumer: in_kafka in a group, printing each record as a JSON line on
# stdout. BOOTSTRAP, TOPIC and GROUP come from the environment.
service:
  flush: 1
  grace: 10
  log_level: warn
pipeline:
  inputs:
    - name: kafka
      brokers: ${BOOTSTRAP}
      topics: ${TOPIC}
      group_id: ${GROUP}
      poll_ms: 100
      rdkafka.auto.offset.reset: earliest
  outputs:
    - name: stdout
      match: "*"
      format: json_lines
