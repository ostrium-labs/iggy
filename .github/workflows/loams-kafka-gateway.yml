# Ostrium Labs fork only (ostrium-labs/iggy, branch `loams`). Upstream's own
# workflows are disabled in this fork (docs/loams/README.md); this one builds
# and tests the Kafka gateway and nothing else, so the fork stays inside the
# organisation's shared GitHub Actions concurrency.
name: Loams Kafka gateway

on:
  pull_request:
    branches: [loams]
  push:
    branches: [loams]
  schedule:
    # Nightly full run. Cron fires on the default branch, which is `loams`.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: loams-kafka-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IGGY_CI_BUILD: true

jobs:
  changes:
    name: "Gateway: changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Docs-only pull requests skip the build. Anything else, and every
          # push, schedule or dispatch, runs it.
          if [[ "$EVENT" != pull_request ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE"...HEAD); then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qvE '(^docs/loams/|\.md$)' <<< "$changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  gateway:
    name: "Gateway: lint and test"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/utils/setup-rust
        with:
          install-nextest: "true"
          shared-key: loams-kafka-gateway
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Setup Java (host javac for the real-client probes)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (gateway)
        run: cargo clippy --locked -p iggy-gateway-kafka --all-targets -- -D warnings

      - name: Build iggy-server
        run: cargo build --locked -p server --bin iggy-server

      - name: Wire fixtures
        run: ./gateways/kafka/scripts/ci-wire-fixtures.sh generate

      - name: Free disk for the nightly client matrix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          # RisingWave's image alone unpacks to about 7.6 GB; Flink and Connect add 2 GB more.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pull client images
        shell: bash
        run: |
          # The suites run containers with --pull never; read every pinned
          # image tag out of the test sources so a bump cannot desync.
          images=$(grep -rhoP '^(pub )?const [A-Z0-9_]*_IMAGE: &str = "\K[^"]+' gateways/kafka/tests | sort -u)
          for image in $images; do
            timeout 600 docker pull -q "$image"
          done
          # Redpanda is a nightly oracle only.
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag=$(grep -rhoP '^pub const REDPANDA_ORACLE_TAG: &str = "\K[^"]+' gateways/kafka/tests)
            timeout 600 docker pull -q "$tag"
            echo "KAFKA_ORACLE_REDPANDA=1" >> "$GITHUB_ENV"
            # The client matrix's nightly clients (Vector, Fluent Bit, RisingWave, Flink,
            # Connect with Debezium): `*_NIGHTLY` constants, never pulled on pull requests.
            nightly=$(grep -rhoP '^pub const [A-Z0-9_]*_NIGHTLY: &str = "\K[^"]+' gateways/kafka/tests | sort -u)
            for image in $nightly; do
              timeout 900 docker pull -q "$image"
            done
            echo "KAFKA_CLIENT_MATRIX_FULL=1" >> "$GITHUB_ENV"
          fi

      - name: Test (gateway)
        env:
          KAFKA_FIXTURES_REQUIRED: "1"
          KAFKA_E2E_REQUIRED: "1"
          KAFKA_ORACLE_REPORT: ${{ runner.temp }}/oracle-report.txt
          KAFKA_CLIENT_MATRIX_DIR: ${{ runner.temp }}/client-matrix
        run: cargo nextest run --locked -p iggy-gateway-kafka --profile ci --no-fail-fast

      - name: Oracle report
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/oracle-report.txt"
          {
            echo "### Gateway vs oracles"
            echo
            echo '```text'
            if [[ -s "$report" ]]; then cat "$report"; else echo "(no report: the oracle suite did not finish)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Client matrix
        if: always()
        shell: bash
        run: |
          dir="$RUNNER_TEMP/client-matrix"
          {
            echo "### Client compatibility matrix (KW-2)"
            echo
            if compgen -G "$dir/*.md" > /dev/null; then
              for file in "$dir"/smoke.md "$dir"/nightly-*.md; do
                [[ -f "$file" ]] && { cat "$file"; echo; }
              done
            else
              echo "(no matrix: the client matrix did not finish)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the client matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-matrix
          path: ${{ runner.temp }}/client-matrix
          if-no-files-found: ignore
          retention-days: 30

  required:
    name: Kafka gateway required
    needs: [changes, gateway]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          GATEWAY: ${{ needs.gateway.result }}
        run: |
          echo "changes=$CHANGES gateway=$GATEWAY"
          [[ "$CHANGES" == success ]] || exit 1
          [[ "$GATEWAY" == success || "$GATEWAY" == skipped ]] || exit 1
