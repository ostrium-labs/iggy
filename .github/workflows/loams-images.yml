# Ostrium Labs fork only (ostrium-labs/iggy, branch `loams`). Builds one image holding
# iggy-server, the iggy CLI and the Kafka gateway (scripts/loams/Dockerfile) and publishes
# it, multi-arch, to ghcr.io/ostrium-labs/iggy:
#
#   loams-<shortsha>   one per merge to `loams` (immutable, what Loams pins by digest)
#   loams              moving, always the latest `loams` build
#
# Each architecture builds natively (no QEMU) and is pushed by digest; the `merge` job joins
# the two into one manifest list, then attests provenance and an SBOM for it, as the Loams
# release images do. GITHUB_TOKEN with `packages: write` is the only credential.
#
# Cost control: it runs on pushes to `loams` and on manual dispatch, not on every pull
# request. A pull request that changes the image's own files gets one amd64 build with no
# push, so a broken Dockerfile fails before it merges. Layers cache in the Actions cache.
name: Loams images

on:
  push:
    branches: [loams]
    # Docs-only merges publish nothing new.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [loams]
    paths:
      - "scripts/loams/Dockerfile*"
      - ".github/workflows/loams-images.yml"
  workflow_dispatch:

concurrency:
  group: loams-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ostrium-labs/iggy

jobs:
  build:
    name: Image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # A pull request builds amd64 only, to check the Dockerfile.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}' || '{"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scripts/loams/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
          # Attestations belong to the joined manifest list, not each architecture.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=loams-images-${{ matrix.arch }}
          cache-to: type=gha,scope=loams-images-${{ matrix.arch }},mode=max
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'iggy-loams:check' || '' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}

      - name: Smoke (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for bin in iggy-server iggy iggy-gateway-kafka; do
            docker run --rm --entrypoint /bin/sh iggy-loams:check -c "test -x /usr/local/bin/$bin"
          done
          docker run --rm iggy-loams:check iggy --version

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Provenance and SBOM attestations are signed with the run's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join amd64 and arm64 into loams-<shortsha> and loams
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          cd "$RUNNER_TEMP/digests"
          [[ "$(ls | wc -l)" == 2 ]] || { echo "expected 2 digests, got: $(ls)"; exit 1; }
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create \
            -t "$IMAGE:loams-$short" -t "$IMAGE:loams" \
            --annotation "index:org.opencontainers.image.source=https://github.com/ostrium-labs/iggy" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:loams-$short" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "no digest for $IMAGE:loams-$short"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:loams-$short"
          {
            echo "### Published"
            echo
            echo '```text'
            echo "$IMAGE:loams-$short"
            echo "$IMAGE:loams"
            echo "$IMAGE@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build provenance (attested to the registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false

      - name: SBOM attestation (attested to the registry)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
